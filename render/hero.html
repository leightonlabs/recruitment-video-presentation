<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>占位主图</title>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05101d}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// 占位主图：用与点云相同的几何体渲染“边界案例 017”，在 AI 主图定稿前供排版与对位。
// 渲染完成后在 window.HERO_ANCHORS 中给出目标多边形、反光框与蒸汽区域的像素坐标。
import * as THREE from './node_modules/three/build/three.module.js';
import { HERO_CAMERA, HERO_GEOMETRY as G } from './geometry.js';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06111e);
scene.fog = new THREE.Fog(0x06111e, 8, 22);
const cam = new THREE.PerspectiveCamera(HERO_CAMERA.fov, W / H, 0.1, 100);
cam.position.set(...HERO_CAMERA.position);
cam.lookAt(...HERO_CAMERA.target);

scene.add(new THREE.HemisphereLight(0x6f8fb8, 0x0a1018, 0.55));
const key = new THREE.SpotLight(0xffc98a, 60, 14, Math.PI / 7, 0.6, 1.2);
key.position.set(-3, 4.5, 4.5); key.target.position.set(0, -0.3, 0); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x7fb2ff, 0.8); rim.position.set(3, 2, -4); scene.add(rim);

const steel = new THREE.MeshStandardMaterial({ color: 0x8b98a5, metalness: 0.75, roughness: 0.38 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x4d5864, metalness: 0.7, roughness: 0.5 });

function softTexture(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = softTexture(g => {
  const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
});
const rustTex = softTexture(g => {
  let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 900; i++) {
    const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.7) * 100;
    const x = 128 + Math.cos(a) * d * 0.8, y = 120 + Math.sin(a) * d;
    g.fillStyle = `rgba(${110 + rnd() * 50},${50 + rnd() * 25},${20 + rnd() * 10},${0.25 + rnd() * 0.3})`;
    g.beginPath(); g.arc(x, y, 3 + rnd() * 9, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(90,45,20,.55)'; g.fillRect(118, 150, 16, 106);
});

// 管道、双法兰与螺栓
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(G.pipeR, G.pipeR, 14, 64), steel); pipe.rotation.z = Math.PI / 2; scene.add(pipe);
for (const x of G.flangeX) {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(G.flangeR, G.flangeR, G.flangeT, 64), steel); f.rotation.z = Math.PI / 2; f.position.x = x; scene.add(f);
}
for (let b = 0; b < 8; b++) {
  const a = (b / 8) * Math.PI * 2 + Math.PI / 8;
  const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.46, 12), darkSteel);
  stud.rotation.z = Math.PI / 2; stud.position.set(0, Math.cos(a) * G.boltR, Math.sin(a) * G.boltR); scene.add(stud);
  for (const x of [-0.2, 0.2]) {
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.06, 6), darkSteel);
    nut.rotation.z = Math.PI / 2; nut.position.set(x, Math.cos(a) * G.boltR, Math.sin(a) * G.boltR); scene.add(nut);
  }
}
// 锈迹与渗漏水痕（贴在法兰下沿正面）
const rust = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), new THREE.MeshBasicMaterial({ map: rustTex, transparent: true, depthWrite: false }));
rust.position.set(...G.stain); scene.add(rust);
// 压力表与立管
const riser = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.75, 16), steel); riser.position.set(G.gauge[0], 0.82, 0); scene.add(riser);
const gaugeBody = new THREE.Mesh(new THREE.CylinderGeometry(G.gaugeR, G.gaugeR, 0.14, 48), darkSteel); gaugeBody.rotation.x = Math.PI / 2; gaugeBody.position.set(...G.gauge); scene.add(gaugeBody);
const face = new THREE.Mesh(new THREE.CircleGeometry(G.gaugeR * 0.86, 48), new THREE.MeshStandardMaterial({ color: 0xe8eef3, roughness: 0.2 }));
face.position.set(G.gauge[0], G.gauge[1], G.gauge[2] + 0.075); scene.add(face);
const glare = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, opacity: 0.95, depthWrite: false }));
glare.position.set(G.gauge[0] - 0.08, G.gauge[1] + 0.08, G.gauge[2] + 0.12); glare.scale.set(0.55, 0.42, 1); scene.add(glare);
// 阀门手轮
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.15, 24), steel); stem.position.set(G.wheel[0], 1.05, G.wheel[2]); scene.add(stem);
const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 12, 48), new THREE.MeshStandardMaterial({ color: 0xb3261e, roughness: 0.45 }));
wheel.rotation.x = Math.PI / 2; wheel.position.set(...G.wheel); scene.add(wheel);
// 蒸汽：挡住锈迹右下边缘
for (let i = 0; i < 4; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xdfe8ef, opacity: 0.22, depthWrite: false }));
  sp.position.set(G.steam[0] + i * 0.12, G.steam[1] + i * 0.1, G.steam[2]); sp.scale.set(0.55 + i * 0.15, 0.45 + i * 0.12, 1); scene.add(sp);
}
// 背景：远处管廊与琥珀色灯点
let s = 3; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 9; i++) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 9, 8), new THREE.MeshStandardMaterial({ color: 0x1b2a3a, roughness: 0.8 }));
  post.position.set(-9 + i * 2.3, 1, -7 - rnd() * 3); scene.add(post);
}
for (let i = 0; i < 26; i++) {
  const l = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffb347, opacity: 0.55 + rnd() * 0.4, depthWrite: false, fog: false }));
  l.position.set(-10 + rnd() * 20, -1 + rnd() * 5, -9 - rnd() * 4); const k = 0.15 + rnd() * 0.35; l.scale.set(k, k, 1); scene.add(l);
}

renderer.render(scene, cam);

// 像素坐标
const toPx = v => { const p = new THREE.Vector3(...v).project(cam); return [Math.round((p.x + 1) / 2 * W), Math.round((1 - p.y) / 2 * H)]; };
const ring = (c, rx, ry, n, jitter) => Array.from({ length: n }, (_, i) => {
  const a = (i / n) * Math.PI * 2, j = 1 + Math.sin(i * 2.7) * jitter;
  return toPx([c[0] + Math.cos(a) * rx * j, c[1] + Math.sin(a) * ry * j, c[2]]);
});
const box = (c, r) => { const a = toPx([c[0] - r, c[1] + r, c[2]]), b = toPx([c[0] + r, c[1] - r, c[2]]); return [a[0], a[1], b[0], b[1]]; };
window.HERO_ANCHORS = {
  size: [W, H],
  target: ring([G.stain[0], G.stain[1] - 0.02, G.stain[2]], 0.2, 0.26, 9, 0.12),
  glare: box([G.gauge[0], G.gauge[1], G.gauge[2] + 0.1], G.gaugeR * 1.05),
  steam: box(G.steam, 0.22),
  gauge: toPx(G.gauge),
  flange: toPx([0, 0, 0]),
};
window.ready = true;
</script>
</body></html>
